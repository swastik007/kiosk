<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <link href="src/qc.slider.css" rel="stylesheet">
    <link href="src/custom.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Poppins", sans-serif;
        }
        section.slide{
            height: 100vh!important;
        }
    </style>
</head>

<body class="h-full w-full">
    <div class="carousel min-h-screen justify-center">
        <section class="slide">
            <div class="slider-container">
                <ul class="slider-wrapper" id="slider">
                    <li class="slide-current">
                        <img src="images/slider-img1.jpg"/>
                        <div class="capa"></div>
                    </li>
                    <li class="">
                        <img src="images/slider-img2.jpg"/>
                        <div class="capa"></div>
                    </li>
                    <li class="video" data-type="video" data-video="images/slider-vid1.mp4" data-muted="true"></li>
                    <li class="video" data-type="video" data-video="images/slider-vid2.mp4" data-muted="true"></li>                    
                    <li class="video" data-type="youtube" data-video="5Sop74sgcQU" data-muted="true"></li>
                    <li class="video" data-type="youtube" data-video="0qi8iU7KLFA" data-muted="true"></li>
                </ul>
                <div class="drt-control control-left" id="lft-control">
                    <svg xmlns="http://www.w3.org/2000/svg" class="size-8 xl:size-28 fill-white" viewBox="0 0 24 24" >
                        <path d="M13.293 6.293 7.586 12l5.707 5.707 1.414-1.414L10.414 12l4.293-4.293z"></path>
                    </svg>
                </div>
                  <div class="drt-control control-right" id="rht-control">
                    <svg xmlns="http://www.w3.org/2000/svg" class="size-8 xl:size-28 fill-white" viewBox="0 0 24 24" >
                        <path d="M10.707 17.707 16.414 12l-5.707-5.707-1.414 1.414L13.586 12l-4.293 4.293z"></path>
                    </svg>
                  </div>
               
                <ul class="slider-controls" id="slider-controls"></ul>
                <div class="tempo-bar" id="barra"></div>
            </div>
        </section>
    </div>
    <script src="src/jquery.js">
    </script>
     <script src="src/qcslider.jquery.js">
    </script>
    <script src="src/script.js"></script>
</body>

</html>
