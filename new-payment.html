<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<style>
    body {
        font-family: "Poppins", sans-serif;
    }
</style>

<body id="mainDiv" class="bg-red-50 text-gray-900 flex flex-col min-h-screen">
    <header class="sticky top-0 z-10 bg-white shadow-md h-fit">
        <section class="header py-6 border-b border-gray-300">
            <div class="logo flex justify-center">
                <img src="images/logo-dmart.png" class="h-8 kiosk:h-12 w-auto" alt="Logo">
            </div>
        </section>
        <section class="banner-area py-1 block lg:hidden kiosk:block">
            <div class="grid grid-cols-1 px-4">
                <div class=" h-[170px] kiosk:h-[240px]">
                    <img src="images/gifs/gif1.gif" class="w-full h-full object-cover object-center" alt="Banner">
                </div>
            </div>
        </section>
    </header>
    <!-- Menu Page -->
    <div class="flex flex-col lg:max-w-6xl lg:mx-auto lg:grid lg:grid-cols-12 kiosk:flex kiosk:flex-col">
        <div class="flex kiosk:flex-1 kiosk:overflow-hidden pt-4 h-[66vh] lg:h-full kiosk:h-[72vh] overflow-y-hidden lg:overflow-auto kiosk:overflow-y-hidden lg:col-span-8 xl:col-span-9" id="productMainPage">
            <main class="wrapper-div h-[62vh] lg:h-fit kiosk:max-h-[72vh] overflow-y-auto  kiosk:p-2 m-2 w-full">
                <div class="bg-white w-full pointer-events-auto modal-style rounded-md overflow-y-auto mx-auto">
                    <div class="p-4 flex items-center justify-between space-x-2 border-b border-gray-lighter">
                        <h5 class="font-semibold text-xl kiosk:text-4xl mb-0">
                            My Cart (5)
                        </h5>
                        <a href="javascript:void(0);" class="block" data-close="">
                            <svg class="stroke-current text-red-600 size-10" viewBox="0 0 24 24" stroke-width="4" stroke="#6c7893" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M0 0h24v24H0z" stroke="none"></path>
                                <path d="M18 6 6 18M6 6l12 12"></path>
                            </svg>
                        </a>
                    </div>
                    <!-- Modal Content Goes Here -->
                    <div class="flex flex-col p-4">
                        <div class="flex flex-col my-2 gap-y-4 p-4">



                            <button class="bg-blue-700 text-white font-medium py-4 kiosk:py-8 px-4 kiosk:px-6 text-xl rounded-2xl flex flex-row justify-between items-center confirmPayment" data-paymenttype="CASH" data-tendertype="1">
                                        <span class="font-semibold text-xl kiosk:text-4xl pl-5">Pay with Cash</span>
                                        <img class="size-16 kiosk:size-28" src="/NewTemplate/images/cash.png">
                                    </button>
                            <button class="bg-green-600 text-white font-medium py-4 kiosk:py-8 px-4 kiosk:px-6 text-xl rounded-2xl flex flex-row justify-between items-center confirmPayment" data-paymenttype="CARD" data-tendertype="1">
                                        <span class="font-semibold text-xl kiosk:text-4xl pl-5">Pay with Card</span>
                                        <img class="size-16 kiosk:size-28" src="/NewTemplate/images/credit-card.png">
                                    </button>
                            <button class="bg-green-600 text-white font-medium py-4 kiosk:py-8 px-4 kiosk:px-6 text-xl rounded-2xl flex flex-row justify-between items-center confirmPayment" data-paymenttype="UPI" data-tendertype="2">
                                        <span class="font-semibold text-xl kiosk:text-4xl pl-5">Pay with UPI</span>
                                        <img class="size-16 kiosk:size-28" src="/NewTemplate/images/qr-img.png">
                                    </button>

                            <a href="/" class="bg-red-600 text-white font-medium py-4 kiosk:py-8 px-4 kiosk:px-6 text-xl rounded-2xl flex flex-row justify-between items-center">
                                <span class="font-semibold text-xl kiosk:text-4xl pl-5">Cancel this order</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="size-16 kiosk:size-32 fill-white" viewBox="0 0 24 24"><path d="M9.172 16.242 12 13.414l2.828 2.828 1.414-1.414L13.414 12l2.828-2.828-1.414-1.414L12 10.586 9.172 7.758 7.758 9.172 10.586 12l-2.828 2.828z"></path><path d="M12 22c5.514 0 10-4.486 10-10S17.514 2 12 2 2 6.486 2 12s4.486 10 10 10zm0-18c4.411 0 8 3.589 8 8s-3.589 8-8 8-8-3.589-8-8 3.589-8 8-8z"></path></svg>
                            </a>
                        </div>
                    </div>

                </div>
            </main>
        </div>
        <div class="flex flex-col w-full lg:px-6 kiosk:max-w-full kiosk:w-full lg:col-span-4 lg:max-w-[320px] xl:col-span-3 ml-auto mr-0">

            <footer class="border border-green-500 bg-red-50 lg:border-gray-100 lg:bg-slate-200 kiosk:border-green-500 kiosk:bg-red-50 rounded-none
             lg:rounded-xl kiosk:rounded-none shadow-lg sticky lg:static lg:top-0 lg:top-auto bottom-0 text-white py-2 kiosk:py-4 lg:mt-6 mt-auto px-2 kiosk:px-4">
                <div class="flex justify-end lg:justify-center kiosk:justify-end border-y-2 border-green-600 lg:border-y-0 kiosk:border-y-2 kiosk:border-green-600 py-1 kiosk:py-3 pr-4 mb-3 hideProduct" id="totalItemSection">
                    <h6 class="text-lg kiosk:text-4xl text-gray-800 font-semibold flex flex-row lg:flex-col kiosk:flex-row items-center">Total:
                        <span class="text-green-600 kiosk:text-yellow-500 text-2xl kiosk:text-5xl mr-2 lg:mr-auto kiosk:mr-2" id="checkoutTotal">435</span></h6>
                </div>
                <div class="flex lg:flex-col kiosk:flex-row kiosk:flex-wrap justify-between py-2 kiosk:py-4 gap-x-4 lg:gap-y-3">
                    <a href="#" class="bg-red-600 flex justify-center rounded-xl  font-semibold text-white py-2 kiosk:py-4 text-base kiosk:text-5xl px-2 kiosk:px-6 backBtn hideProduct" id="backBtnFooter">
                        <span>Back</span>
                    </a>
                    <button class="text-white flex flex-grow bg-green-600 rounded-xl font-semibold py-2 kiosk:py-4 text-base kiosk:text-5xl px-2 kiosk:px-6 hideProduct" id="itemsSelectedBtn">
                        <div class="flex flex-col flex-grow">
                            <span class="totalItems">0 item(s)</span>
                        </div>
                        <span></span>
                    </button>

                </div>
            </footer>
            <section class="banner-area py-1 hidden lg:block kiosk:hidden pt-6">
                <div class="grid grid-cols-1 px-0">
                    <div class="w-full h-[240px] rounded-xl">
                        <img src="images/gifs/kfc-gif.gif" class="w-full h-full object-cover object-center rounded-xl" alt="Banner">
                    </div>
                </div>
            </section>

        </div>

    </div>


</body>

</html>
